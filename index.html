<!doctype html>
<html lang="pt-BR" data-vice-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080412" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Task de Viagem</title>
    <meta name="description" content="Organizador mobile de tarefas de viagem para Leeo e Marii com sincronização em tempo real." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('task_viagem_atmosphere') || 'auto';
          var resolved = pref;
          if (pref !== 'day' && pref !== 'sunset' && pref !== 'night') {
            var hour = new Date().getHours();
            if (hour >= 6 && hour < 17) resolved = 'day';
            else if (hour >= 17 && hour < 20) resolved = 'sunset';
            else resolved = 'night';
          }
          document.documentElement.setAttribute('data-vice-theme', resolved);
          var colors = { day: '#FFF3E8', sunset: '#240E3B', night: '#080412' };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[resolved] || '#080412');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#FF2E93] selection:text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
